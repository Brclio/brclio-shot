name: Bug report
description: 报告可复现的截图、编辑、保存或桌面行为问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除截图、路径和日志中的个人信息。安全漏洞请使用私密 Security Advisory，不要在这里公开。

  - type: input
    id: version
    attributes:
      label: Brclio Shot 版本
      description: 可在“关于 Brclio Shot”查看。
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS 13+
        - Windows 10/11 64-bit
        - 其他（当前不受支持）
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: 系统版本与 CPU 架构
      placeholder: macOS 15.6 arm64 / Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: capture_mode
    attributes:
      label: 涉及功能
      options:
        - 区域截图
        - 窗口来源列表/窗口截图
        - 当前屏幕
        - 延时截图
        - 手动滚动长截图
        - 网页整页截图
        - 编辑器/贴图
        - 历史/保存路径
        - 快捷键/托盘/启动
        - 构建/安装/权限
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从应用启动开始，写出能稳定触发问题的最小步骤。
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包含完整错误文字；上传图片前请打码。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 补充环境
      description: 显示器数量/缩放、目标应用、保存格式、快捷键冲突、签名状态等。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我已移除账号、Cookie、私密截图、证书、完整个人路径等敏感信息。
          required: true
        - label: 这不是未公开的安全漏洞。
          required: true
